on:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu kopyala
        uses: actions/checkout@v4

      - name: Quarto'yu kur
        uses: quarto-dev/quarto-actions/setup@v2

      - name: GitHub Pages'te Yayınla
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}